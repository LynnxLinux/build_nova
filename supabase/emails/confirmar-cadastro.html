<!-- Supabase > Authentication > Emails > Templates > "Confirm signup"
     Assunto sugerido:  {{ .Token }} é o seu código de confirmação do Qwerty -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1f2937">
  <h2 style="margin:0 0 8px">Confirme seu e-mail no Qwerty</h2>
  <p style="margin:0 0 20px">Use o código abaixo para finalizar o seu cadastro:</p>
  <p style="font-size:34px;letter-spacing:8px;font-weight:bold;background:#f3f4f6;border-radius:8px;padding:16px;text-align:center;margin:0 0 20px">{{ .Token }}</p>
  <p style="font-size:13px;color:#6b7280;margin:0">O código vale por 1 hora. Se você não criou uma conta no Qwerty, ignore este e-mail.</p>
</div>
