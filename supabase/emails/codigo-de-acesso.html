<!-- Supabase > Authentication > Emails > Templates > "Magic Link"
     (é este modelo que o Supabase usa para "entrar com código")
     Assunto sugerido:  {{ .Token }} é o seu código de acesso ao Qwerty -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1f2937">
  <h2 style="margin:0 0 8px">Seu código de acesso</h2>
  <p style="margin:0 0 20px">Digite este código no site do Qwerty para entrar:</p>
  <p style="font-size:34px;letter-spacing:8px;font-weight:bold;background:#f3f4f6;border-radius:8px;padding:16px;text-align:center;margin:0 0 20px">{{ .Token }}</p>
  <p style="font-size:13px;color:#6b7280;margin:0">O código vale por 1 hora. Se não foi você quem pediu, ignore este e-mail.</p>
</div>
